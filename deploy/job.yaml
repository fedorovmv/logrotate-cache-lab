apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  labels:
    app.kubernetes.io/name: logrotate-cache-lab
    loglab.strategy: __STRATEGY__
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logrotate-cache-lab
        loglab.strategy: __STRATEGY__
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: loglab
          image: __IMAGE__
          imagePullPolicy: Never
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              /usr/local/bin/loglab run
              --run-id=__JOB_NAME__
              --strategy=__STRATEGY__
              --log-dir=/var/log/loglab
              --result-dir=/results
              --max-file-bytes=__MAX_FILE_BYTES__
              --rotations=__ROTATIONS__
              --max-backups=0
              --record-bytes=512
              --bytes-per-second=__BYTES_PER_SECOND__
              --buffer-bytes=65536
              --flush-interval=100ms
              --monitor-interval=100ms
              --resident-bytes=__RESIDENT_BYTES__
          resources:
            requests:
              memory: __MEMORY_MIB__Mi
            limits:
              memory: __MEMORY_MIB__Mi
          volumeMounts:
            - name: logs
              mountPath: /var/log/loglab
            - name: results
              mountPath: /results
      volumes:
        - name: logs
          emptyDir: {}
        - name: results
          emptyDir: {}
